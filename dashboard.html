<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital File Vault - Dashboard</title>
  <style>
    :root { --bg:#0b1120; --panel:#111a2e; --card:#162038; --border:#263250; --text:#e5eaf5;
            --muted:#8b97b3; --primary:#4f8cff; --primary2:#7c5cff; --danger:#ff6b7a; --star:#ffc857; }
    [data-theme="light"] { --bg:#f3f6fc; --panel:#ffffff; --card:#ffffff; --border:#dfe5f1;
            --text:#1b2540; --muted:#6b7794; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); transition:background .2s;
           font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif; }
    button { font-family:inherit; cursor:pointer; }
    .app { display:grid; grid-template-columns:250px 1fr; min-height:100vh; }

    /* Sidebar */
    .sidebar { background:var(--panel); border-right:1px solid var(--border); padding:22px 16px;
               display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; }
    .logo { font-size:19px; font-weight:700; display:flex; align-items:center; gap:10px; padding:0 8px 18px; }
    .logo span { background:linear-gradient(135deg,var(--primary),var(--primary2)); padding:7px 9px; border-radius:10px; }
    .nav { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; border:none;
           background:transparent; color:var(--muted); font-size:15px; font-weight:600; text-align:left; width:100%; }
    .nav:hover { background:var(--card); color:var(--text); }
    .nav.active { background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(124,92,255,.18)); color:var(--text); }
    .spacer { flex:1; }
    .storage { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:8px; }
    .storage b { font-size:13px; }
    .bar { height:7px; background:var(--border); border-radius:5px; margin:10px 0 6px; overflow:hidden; }
    .bar div { height:100%; width:0; background:linear-gradient(90deg,var(--primary),var(--primary2)); transition:.4s; }
    .storage small { color:var(--muted); font-size:12px; }

    /* Main */
    .topbar { display:flex; align-items:center; gap:12px; padding:14px 28px; background:var(--panel);
              border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
    .burger { display:none; background:none; border:none; color:var(--text); font-size:22px; }
    .search { flex:1; max-width:520px; position:relative; }
    .search input { width:100%; padding:11px 14px 11px 40px; border-radius:10px; border:1px solid var(--border);
                    background:var(--bg); color:var(--text); font-size:15px; outline:none; }
    .search input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,140,255,.18); }
    .search i { position:absolute; left:13px; top:10px; font-style:normal; opacity:.6; }
    .icon-btn { background:var(--card); border:1px solid var(--border); color:var(--text); width:40px; height:40px;
                border-radius:10px; font-size:17px; }
    .user { display:flex; align-items:center; gap:10px; font-weight:600; font-size:14px; }
    .avatar { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:#fff;
              background:linear-gradient(135deg,var(--primary),var(--primary2)); text-transform:uppercase; }
    .content { padding:26px 28px; }
    .crumbs { font-size:14px; color:var(--muted); margin-bottom:8px; display:flex; flex-wrap:wrap; gap:6px; }
    .crumbs a { cursor:pointer; color:var(--primary); } .crumbs a:hover { text-decoration:underline; }
    .head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
    h2 { margin:0; font-size:26px; }
    .actions { display:flex; gap:10px; }
    .btn { padding:11px 18px; border-radius:10px; font-size:14px; font-weight:600; border:1px solid var(--border);
           background:var(--card); color:var(--text); }
    .btn:hover { border-color:var(--primary); }
    .btn.primary { border:none; color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary2)); }
    .btn.danger { background:var(--danger); border:none; color:#fff; }

    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
    .item { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 16px 14px;
            position:relative; transition:.15s; cursor:pointer; }
    .item:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.18); }
    .ico { font-size:40px; line-height:1; margin-bottom:12px; height:70px; display:flex; align-items:center; }
    .ico img { width:100%; height:70px; object-fit:cover; border-radius:8px; }
    .name { font-weight:600; font-size:15px; word-break:break-word; margin-bottom:4px; }
    .meta { font-size:12px; color:var(--muted); }
    .tools { display:flex; gap:4px; margin-top:12px; border-top:1px solid var(--border); padding-top:10px; }
    .tools button { flex:1; background:none; border:none; color:var(--muted); font-size:16px; padding:5px; border-radius:7px; }
    .tools button:hover { background:var(--bg); color:var(--text); }
    .tools button.on { color:var(--star); }
    .empty { text-align:center; padding:70px 20px; color:var(--muted); display:none; }
    .empty .big { font-size:56px; margin-bottom:10px; }

    /* Modal + toast */
    .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center;
             justify-content:center; padding:16px; z-index:20; }
    .modal.show { display:flex; }
    .dialog { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:24px;
              width:100%; max-width:400px; }
    .dialog h3 { margin:0 0 8px; } .dialog p { margin:0 0 16px; color:var(--muted); font-size:14px; }
    .dialog input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--border);
                    background:var(--bg); color:var(--text); font-size:15px; outline:none; margin-bottom:18px; }
    .dialog input:focus { border-color:var(--primary); }
    .row { display:flex; justify-content:flex-end; gap:10px; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
             background:var(--card); border:1px solid var(--border); padding:12px 20px; border-radius:10px;
             font-size:14px; transition:.25s; pointer-events:none; z-index:40; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .overlay { display:none; }

    /* Preview */
    .pv-box { background:var(--panel); border:1px solid var(--border); border-radius:16px; width:100%;
              max-width:920px; height:86vh; display:flex; flex-direction:column; overflow:hidden; }
    .pv-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 18px;
               border-bottom:1px solid var(--border); }
    .pv-head b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pv-head div { display:flex; gap:8px; flex-shrink:0; }
    .pv-head .btn { padding:8px 14px; }
    .pv-body { flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; background:var(--bg); }
    .pv-body img { max-width:100%; max-height:100%; object-fit:contain; }
    .pv-body iframe { width:100%; height:100%; border:none; background:#fff; }
    .pv-body video { max-width:100%; max-height:100%; }
    .pv-body pre { width:100%; height:100%; margin:0; padding:18px; overflow:auto; white-space:pre-wrap;
                   word-break:break-word; align-self:flex-start; font-size:13px; }
    .nopv { text-align:center; color:var(--muted); } .nopv .big { font-size:56px; margin-bottom:8px; }

    /* Drag and drop */
    .dropzone { position:fixed; inset:12px; border:3px dashed var(--primary); border-radius:20px;
                background:rgba(79,140,255,.12); display:none; align-items:center; justify-content:center;
                font-size:22px; font-weight:700; z-index:50; pointer-events:none; }
    .dropzone.show { display:flex; }

    @media (max-width:860px) {
      .app { grid-template-columns:1fr; }
      .sidebar { position:fixed; left:0; top:0; width:260px; z-index:15; transform:translateX(-100%); transition:.25s; }
      .sidebar.open { transform:translateX(0); }
      .overlay.show { display:block; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:12; }
      .burger { display:block; }
      .topbar, .content { padding-left:16px; padding-right:16px; }
      .user span { display:none; }
      .pv-box { height:92vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><span>🔐</span> File Vault</div>
      <button class="nav active" data-view="vault">📁 My Vault</button>
      <button class="nav" data-view="fav">⭐ Favorites</button>
      <div class="spacer"></div>
      <div class="storage">
        <b>Storage</b>
        <div class="bar"><div id="bar"></div></div>
        <small id="storageText">0 B of 100 MB used</small>
      </div>
      <button class="nav" id="logout">🚪 Log Out</button>
    </aside>
    <div class="overlay" id="overlay"></div>

    <main>
      <header class="topbar">
        <button class="burger" id="burger">☰</button>
        <div class="search"><i>🔍</i><input id="search" type="text" placeholder="Search files and folders..."></div>
        <button class="icon-btn" id="theme" title="Toggle theme">🌙</button>
        <div class="user"><div class="avatar" id="avatar"></div><span id="username"></span></div>
      </header>

      <section class="content">
        <div class="crumbs" id="crumbs"></div>
        <div class="head">
          <h2 id="title">My Vault</h2>
          <div class="actions">
            <button class="btn" id="uploadBtn">⬆ Upload</button>
            <button class="btn primary" id="newFolder">＋ New Folder</button>
          </div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty"><div class="big" id="emptyIcon">📂</div><div id="emptyText"></div></div>
      </section>
    </main>
  </div>

  <input type="file" id="fileInput" multiple hidden>
  <div class="dropzone" id="dz">⬆ Drop files to upload</div>

  <div class="modal" id="modal">
    <div class="dialog">
      <h3 id="mTitle"></h3><p id="mText"></p>
      <input id="mInput" type="text" maxlength="120">
      <div class="row">
        <button class="btn" id="mCancel">Cancel</button>
        <button class="btn primary" id="mOk">OK</button>
      </div>
    </div>
  </div>

  <div class="modal" id="pv">
    <div class="pv-box">
      <div class="pv-head">
        <b id="pvName"></b>
        <div>
          <button class="btn" id="pvDl">⬇ Download</button>
          <button class="btn" id="pvClose">✕ Close</button>
        </div>
      </div>
      <div class="pv-body" id="pvBody"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id);
    const user = sessionStorage.getItem("vault_current_user");
    if (!user) location.href = "index.html";

    const KEY = "vault_data_" + user;
    const QUOTA = 100 * 1024 * 1024; // 100 MB
    let items = JSON.parse(localStorage.getItem(KEY) || "[]");
    let state = { view: "vault", folder: null, query: "" };
    const save = () => localStorage.setItem(KEY, JSON.stringify(items));
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const usedBytes = () => items.reduce((s, i) => s + (i.size || 0), 0);

    function fmt(b) {
      if (b < 1024) return b + " B";
      if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
      if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
      return (b / 1073741824).toFixed(2) + " GB";
    }
    function fileIcon(f) {
      const t = f.mime || "";
      if (t.startsWith("image/")) return "🖼️";
      if (t === "application/pdf") return "📕";
      if (t.startsWith("video/")) return "🎞️";
      if (t.startsWith("audio/")) return "🎵";
      if (t.startsWith("text/")) return "📝";
      return "📄";
    }

    /* ---------- IndexedDB (stores the real file data) ---------- */
    let dbp;
    function db() {
      if (!dbp) dbp = new Promise((res, rej) => {
        const r = indexedDB.open("vault_files", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("blobs");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      return dbp;
    }
    async function putBlob(id, blob) {
      const d = await db();
      return new Promise((res, rej) => {
        const t = d.transaction("blobs", "readwrite");
        t.objectStore("blobs").put(blob, id);
        t.oncomplete = res; t.onerror = () => rej(t.error);
      });
    }
    async function getBlob(id) {
      const d = await db();
      return new Promise((res, rej) => {
        const r = d.transaction("blobs").objectStore("blobs").get(id);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    }
    async function delBlob(id) {
      const d = await db();
      return new Promise(res => {
        const t = d.transaction("blobs", "readwrite");
        t.objectStore("blobs").delete(id); t.oncomplete = res; t.onerror = res;
      });
    }

    /* ---------- Header / theme ---------- */
    $("username").textContent = user;
    $("avatar").textContent = user.charAt(0);
    function applyTheme(t) {
      document.documentElement.dataset.theme = t;
      $("theme").textContent = t === "dark" ? "🌙" : "☀️";
      localStorage.setItem("vault_theme", t);
    }
    applyTheme(localStorage.getItem("vault_theme") || "dark");
    $("theme").onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

    /* ---------- Sidebar ---------- */
    const closeMenu = () => { $("sidebar").classList.remove("open"); $("overlay").classList.remove("show"); };
    $("burger").onclick = () => { $("sidebar").classList.add("open"); $("overlay").classList.add("show"); };
    $("overlay").onclick = closeMenu;
    document.querySelectorAll(".nav[data-view]").forEach(b => b.onclick = () => {
      state.view = b.dataset.view; state.folder = null; state.query = ""; $("search").value = "";
      closeMenu(); render();
    });
    $("logout").onclick = () => { sessionStorage.removeItem("vault_current_user"); location.href = "index.html"; };

    /* ---------- Modal ---------- */
    let onOk = null;
    function openModal({ title, text = "", input = false, value = "", okText = "OK", danger = false, ok }) {
      $("mTitle").textContent = title; $("mText").textContent = text;
      $("mInput").style.display = input ? "block" : "none"; $("mInput").value = value;
      $("mOk").textContent = okText; $("mOk").className = "btn " + (danger ? "danger" : "primary");
      onOk = ok; $("modal").classList.add("show");
      if (input) setTimeout(() => { $("mInput").focus(); $("mInput").select(); }, 50);
    }
    const closeModal = () => $("modal").classList.remove("show");
    $("mCancel").onclick = closeModal;
    $("modal").onclick = e => { if (e.target === $("modal")) closeModal(); };
    $("mOk").onclick = () => { if (onOk && onOk($("mInput").value.trim()) === false) return; closeModal(); };
    $("mInput").addEventListener("keydown", e => { if (e.key === "Enter") $("mOk").click(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closePreview(); } });

    function toast(msg) {
      $("toast").textContent = msg; $("toast").classList.add("show");
      clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("show"), 2600);
    }

    /* ---------- Folder actions ---------- */
    function nameTaken(name, parent, exceptId) {
      return items.some(i => i.parent === parent && i.id !== exceptId && i.name.toLowerCase() === name.toLowerCase());
    }
    function uniqueName(name, parent) {
      if (!nameTaken(name, parent)) return name;
      const dot = name.lastIndexOf(".");
      const base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : "";
      let n = 1;
      while (nameTaken(base + " (" + n + ")" + ext, parent)) n++;
      return base + " (" + n + ")" + ext;
    }
    $("newFolder").onclick = () => {
      if (state.view === "fav") { state.view = "vault"; state.folder = null; render(); }
      openModal({ title: "New folder", text: "Give your folder a name.", input: true, okText: "Create", ok: name => {
        if (!name) { toast("Please enter a name."); return false; }
        if (nameTaken(name, state.folder)) { toast("That name already exists here."); return false; }
        items.push({ id: uid(), type: "folder", name, parent: state.folder, favorite: false, created: Date.now() });
        save(); render(); toast("Folder created.");
      }});
    };

    function descendants(id) {
      let out = [];
      items.filter(i => i.parent === id).forEach(c => { out.push(c.id); out = out.concat(descendants(c.id)); });
      return out;
    }
    function rename(it) {
      openModal({ title: "Rename", input: true, value: it.name, okText: "Save", ok: name => {
        if (!name) { toast("Please enter a name."); return false; }
        if (nameTaken(name, it.parent, it.id)) { toast("That name already exists here."); return false; }
        it.name = name; save(); render(); toast("Renamed.");
      }});
    }
    function remove(it) {
      const extra = it.type === "folder" ? descendants(it.id).length : 0;
      openModal({ title: "Delete " + it.type + "?",
        text: '"' + it.name + '" ' + (extra ? "and its " + extra + " item(s) will be" : "will be") + " permanently deleted.",
        okText: "Delete", danger: true, ok: () => {
          const gone = new Set([it.id, ...descendants(it.id)]);
          items.filter(i => gone.has(i.id) && i.type === "file").forEach(f => delBlob(f.id));
          items = items.filter(i => !gone.has(i.id)); save(); render(); toast("Deleted.");
        }});
    }

    /* ---------- Upload ---------- */
    $("uploadBtn").onclick = () => $("fileInput").click();
    $("fileInput").onchange = e => { uploadFiles(Array.from(e.target.files)); e.target.value = ""; };

    async function uploadFiles(files) {
      if (!files.length) return;
      if (state.view === "fav") { state.view = "vault"; state.folder = null; }
      toast("Uploading...");
      let ok = 0, skipped = 0;
      for (const f of files) {
        if (usedBytes() + f.size > QUOTA) { skipped++; continue; }
        try {
          const id = uid();
          await putBlob(id, f);
          items.push({ id, type: "file", name: uniqueName(f.name, state.folder), parent: state.folder,
                       favorite: false, created: Date.now(), size: f.size, mime: f.type || "" });
          ok++;
        } catch (err) { skipped++; }
      }
      save(); render();
      let msg = ok + " file" + (ok === 1 ? "" : "s") + " uploaded.";
      if (skipped) msg += " " + skipped + " skipped (storage full or error).";
      toast(msg);
    }

    // Drag and drop
    let dragDepth = 0;
    const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types).includes("Files");
    document.addEventListener("dragenter", e => { if (hasFiles(e)) { dragDepth++; $("dz").classList.add("show"); } });
    document.addEventListener("dragleave", e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $("dz").classList.remove("show"); } });
    document.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
    document.addEventListener("drop", e => {
      if (!hasFiles(e)) return;
      e.preventDefault(); dragDepth = 0; $("dz").classList.remove("show");
      uploadFiles(Array.from(e.dataTransfer.files));
    });

    /* ---------- Preview + download ---------- */
    let pvUrl = null, pvItem = null;
    async function openPreview(it) {
      const blob = await getBlob(it.id);
      if (!blob) { toast("File data not found."); return; }
      pvItem = it; $("pvName").textContent = it.name;
      const body = $("pvBody"); body.innerHTML = "";
      const t = it.mime || "";
      if (t.startsWith("image/") || t === "application/pdf" || t.startsWith("video/") || t.startsWith("audio/")) {
        pvUrl = URL.createObjectURL(blob);
        const el = document.createElement(t.startsWith("image/") ? "img" : t === "application/pdf" ? "iframe"
                    : t.startsWith("video/") ? "video" : "audio");
        if (el.tagName === "VIDEO" || el.tagName === "AUDIO") el.controls = true;
        el.src = pvUrl; body.appendChild(el);
      } else if (t.startsWith("text/") || /\.(txt|md|csv|json|js|html|css|log)$/i.test(it.name)) {
        const pre = document.createElement("pre");
        pre.textContent = await blob.slice(0, 200000).text(); body.appendChild(pre);
      } else {
        body.innerHTML = '<div class="nopv"><div class="big">📄</div>No preview available for this file type.<br>You can still download it.</div>';
      }
      $("pv").classList.add("show");
    }
    function closePreview() {
      $("pv").classList.remove("show"); $("pvBody").innerHTML = "";
      if (pvUrl) { URL.revokeObjectURL(pvUrl); pvUrl = null; }
    }
    async function download(it) {
      const blob = await getBlob(it.id);
      if (!blob) { toast("File data not found."); return; }
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = it.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    $("pvClose").onclick = closePreview;
    $("pv").onclick = e => { if (e.target === $("pv")) closePreview(); };
    $("pvDl").onclick = () => pvItem && download(pvItem);

    /* ---------- Render ---------- */
    function crumbs() {
      if (state.view !== "vault" || state.query) { $("crumbs").innerHTML = ""; return; }
      let path = [], cur = state.folder;
      while (cur) { const f = items.find(i => i.id === cur); if (!f) break; path.unshift(f); cur = f.parent; }
      let html = '<a data-go="">My Vault</a>';
      path.forEach(p => html += ' <span>/</span> <a data-go="' + p.id + '">' + esc(p.name) + "</a>");
      $("crumbs").innerHTML = html;
    }
    $("crumbs").onclick = e => {
      const a = e.target.closest("a"); if (!a) return;
      state.folder = a.dataset.go || null; render();
    };

    let thumbUrls = [];
    async function loadThumbs() {
      for (const el of document.querySelectorAll("[data-thumb]")) {
        try {
          const blob = await getBlob(el.dataset.thumb);
          if (!blob || !el.isConnected) continue;
          const url = URL.createObjectURL(blob); thumbUrls.push(url);
          el.innerHTML = '<img src="' + url + '" alt="">';
        } catch (e) {}
      }
    }

    function render() {
      thumbUrls.forEach(u => URL.revokeObjectURL(u)); thumbUrls = [];
      document.querySelectorAll(".nav[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === state.view && !state.query));
      let list, title = "My Vault";
      if (state.query) {
        const q = state.query.toLowerCase();
        list = items.filter(i => i.name.toLowerCase().includes(q)); title = 'Results for "' + state.query + '"';
      } else if (state.view === "fav") {
        list = items.filter(i => i.favorite); title = "Favorites";
      } else {
        list = items.filter(i => i.parent === state.folder);
        const cur = items.find(i => i.id === state.folder); if (cur) title = cur.name;
      }
      list.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === "folder" ? -1 : 1));
      $("title").textContent = title; crumbs();

      $("grid").innerHTML = list.map(i => {
        const isFolder = i.type === "folder";
        const count = isFolder ? items.filter(c => c.parent === i.id).length : 0;
        const meta = isFolder ? count + (count === 1 ? " item" : " items") : fmt(i.size || 0);
        const isImg = !isFolder && (i.mime || "").startsWith("image/");
        return '<div class="item ' + i.type + '" data-id="' + i.id + '">' +
          '<div class="ico"' + (isImg ? ' data-thumb="' + i.id + '"' : "") + ">" + (isFolder ? "📁" : fileIcon(i)) + "</div>" +
          '<div class="name">' + esc(i.name) + '</div><div class="meta">' + meta + "</div>" +
          '<div class="tools">' +
            '<button data-act="fav" class="' + (i.favorite ? "on" : "") + '" title="Favorite">' + (i.favorite ? "★" : "☆") + "</button>" +
            '<button data-act="rename" title="Rename">✏️</button>' +
            (isFolder ? "" : '<button data-act="download" title="Download">⬇️</button>') +
            '<button data-act="delete" title="Delete">🗑️</button></div></div>';
      }).join("");
      loadThumbs();

      const empty = list.length === 0; $("empty").style.display = empty ? "block" : "none";
      if (empty) {
        $("emptyIcon").textContent = state.query ? "🔍" : state.view === "fav" ? "⭐" : "📂";
        $("emptyText").textContent = state.query ? "No matches found." : state.view === "fav" ? "No favorites yet. Tap the star on any item." : "This folder is empty. Upload a file or create a folder.";
      }
      $("newFolder").style.display = state.query ? "none" : "";
      $("uploadBtn").style.display = state.query ? "none" : "";

      const used = usedBytes();
      $("bar").style.width = Math.min(100, used / QUOTA * 100) + "%";
      $("storageText").textContent = fmt(used) + " of 100 MB used";
    }

    $("grid").onclick = e => {
      const card = e.target.closest(".item"); if (!card) return;
      const it = items.find(i => i.id === card.dataset.id); if (!it) return;
      const btn = e.target.closest("button");
      if (btn) {
        if (btn.dataset.act === "fav") { it.favorite = !it.favorite; save(); render(); }
        if (btn.dataset.act === "rename") rename(it);
        if (btn.dataset.act === "download") download(it);
        if (btn.dataset.act === "delete") remove(it);
        return;
      }
      if (it.type === "folder") { state.view = "vault"; state.folder = it.id; state.query = ""; $("search").value = ""; render(); }
      else openPreview(it);
    };

    $("search").addEventListener("input", e => { state.query = e.target.value.trim(); render(); });
    render();
  </script>
</body>
</html>
